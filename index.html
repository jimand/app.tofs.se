<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>app.halvfärdig.se</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, #0d0d2b 0%, #0a0a0f 70%);
      z-index: 0;
    }

    .particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(110vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    .stage {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .title {
      font-size: clamp(2rem, 6vw, 5rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      white-space: nowrap;
      cursor: default;
      user-select: none;

      background: linear-gradient(
        90deg,
        #ff3cac, #784ba0, #2b86c5,
        #06d6a0, #ffbe0b, #fb5607,
        #ff3cac
      );
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;

      animation:
        gradient-shift 4s linear infinite,
        morph-shadow 8s ease-in-out infinite,
        pulse 3s ease-in-out infinite;

      filter: drop-shadow(0 0 24px rgba(255, 60, 172, 0.7));
    }

    @keyframes gradient-shift {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    @keyframes morph-shadow {
      0%   { filter: drop-shadow(0 0 20px rgba(255, 60, 172, 0.8)); }
      16%  { filter: drop-shadow(0 0 30px rgba(120, 75, 160, 0.9)); }
      33%  { filter: drop-shadow(0 0 40px rgba(43, 134, 197, 0.9)); }
      50%  { filter: drop-shadow(0 0 30px rgba(6, 214, 160, 0.9)); }
      66%  { filter: drop-shadow(0 0 40px rgba(255, 190, 11, 0.9)); }
      83%  { filter: drop-shadow(0 0 30px rgba(251, 86, 7, 0.9)); }
      100% { filter: drop-shadow(0 0 20px rgba(255, 60, 172, 0.8)); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1)    skewX(0deg); }
      25%       { transform: scale(1.04) skewX(-1deg); }
      75%       { transform: scale(0.97) skewX(1deg); }
    }

    .subtitle {
      margin-top: 1.2rem;
      font-size: clamp(0.7rem, 1.5vw, 1rem);
      font-weight: 400;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.25);
      animation: fade-in 2s ease forwards;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      border: 1px solid;
      animation: ring-expand 4s ease-out infinite;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
    }

    .ring:nth-child(1) { width: 200px; height: 200px; border-color: rgba(255, 60, 172, 0.4); animation-delay: 0s; }
    .ring:nth-child(2) { width: 350px; height: 350px; border-color: rgba(43, 134, 197, 0.3); animation-delay: 1.3s; }
    .ring:nth-child(3) { width: 500px; height: 500px; border-color: rgba(6, 214, 160, 0.2); animation-delay: 2.6s; }

    @keyframes ring-expand {
      0%   { transform: translate(-50%, -50%) scale(0); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(2);   opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="particles" id="particles"></div>

  <div class="stage">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <h1 class="title">app.halvfärdig.se</h1>
    <p class="subtitle">under construction</p>
  </div>

  <script>
    const container = document.getElementById('particles');
    const colors = ['#ff3cac','#784ba0','#2b86c5','#06d6a0','#ffbe0b','#fb5607'];
    const count = 55;

    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'particle';
      const size = Math.random() * 5 + 2;
      el.style.cssText = `
        width: ${size}px;
        height: ${size}px;
        left: ${Math.random() * 100}%;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        animation-duration: ${Math.random() * 12 + 8}s;
        animation-delay: ${Math.random() * 12}s;
      `;
      container.appendChild(el);
    }
  </script>
</body>
</html>
